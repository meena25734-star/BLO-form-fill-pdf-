  <!-- Verified Digital PDF Check Badge -->
  <circle cx="364" cy="364" r="76" fill="#0F766E" stroke="#1E3A5F" stroke-width="14" />
  <path
    d="M328 365 L353 390 L402 338"
    fill="none"
